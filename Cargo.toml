[package]
name = "suci"
version = "0.1.0"
edition = "2024"

[dependencies]
biblatex = "0.12.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
hayagriva = "0.10.1"
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
ureq = "3.4.2"
